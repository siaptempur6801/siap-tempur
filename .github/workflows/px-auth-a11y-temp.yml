name: PX auth accessibility fixes (temporary)

on:
  push:
    branches:
      - feat/product-experience-v1-1
    paths:
      - .github/workflows/px-auth-a11y-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-experience-v1-1

      - name: Apply surgical accessibility fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          login_path = Path('components/auth/LoginForm.tsx')
          login = login_path.read_text()
          login = replace_once(login,
              "                            {...register('email')}\n                            className={`relative block w-full",
              "                            {...register('email')}\n                            aria-invalid={Boolean(errors.email)}\n                            aria-describedby={errors.email ? 'login-email-error' : undefined}\n                            className={`relative block w-full",
              'login email aria')
          login = replace_once(login,
              "                            <p className=\"mt-1 text-sm text-red-600 font-handwriting\">{errors.email.message}</p>",
              "                            <p id=\"login-email-error\" role=\"alert\" className=\"mt-1 text-sm text-red-600 font-handwriting\">{errors.email.message}</p>",
              'login email error')
          login = replace_once(login,
              "                                {...register('password')}\n                                className={`relative block w-full",
              "                                {...register('password')}\n                                aria-invalid={Boolean(errors.password)}\n                                aria-describedby={errors.password ? 'login-password-error' : undefined}\n                                className={`relative block w-full",
              'login password aria')
          login = replace_once(login,
              "                                onClick={() => setShowPassword(!showPassword)}\n                                className=\"absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-900 transition focus:outline-none\"",
              "                                onClick={() => setShowPassword(!showPassword)}\n                                aria-label={showPassword ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'}\n                                aria-pressed={showPassword}\n                                className=\"absolute right-1 top-1/2 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-md text-gray-500 transition hover:bg-gray-100 hover:text-gray-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-inset\"",
              'login password toggle')
          login = replace_once(login,
              "                            <p className=\"mt-1 text-sm text-red-600 font-handwriting\">{errors.password.message}</p>",
              "                            <p id=\"login-password-error\" role=\"alert\" className=\"mt-1 text-sm text-red-600 font-handwriting\">{errors.password.message}</p>",
              'login password error')
          login = replace_once(login,
              "                                        className=\"text-sm font-bold text-yellow-700 hover:text-yellow-600 underline decoration-wavy\"",
              "                                        className=\"inline-flex min-h-11 items-center text-sm font-bold text-yellow-700 hover:text-yellow-600 underline decoration-wavy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yellow-700 focus-visible:ring-offset-2\"",
              'login resend target')
          login_path.write_text(login)

          register_path = Path('components/auth/RegisterForm.tsx')
          register = register_path.read_text()
          register = replace_once(register,
              "                            {...register('fullName')}\n                            className={`relative block w-full",
              "                            {...register('fullName')}\n                            aria-invalid={Boolean(errors.fullName)}\n                            aria-describedby={errors.fullName ? 'register-name-error' : undefined}\n                            className={`relative block w-full",
              'register name aria')
          register = replace_once(register,
              "                            <p className=\"mt-1 text-sm text-red-600 font-handwriting\">{errors.fullName.message}</p>",
              "                            <p id=\"register-name-error\" role=\"alert\" className=\"mt-1 text-sm text-red-600 font-handwriting\">{errors.fullName.message}</p>",
              'register name error')
          register = replace_once(register,
              "                            {...register('email')}\n                            className={`relative block w-full",
              "                            {...register('email')}\n                            aria-invalid={Boolean(errors.email)}\n                            aria-describedby={errors.email ? 'register-email-error' : undefined}\n                            className={`relative block w-full",
              'register email aria')
          register = replace_once(register,
              "                            <p className=\"mt-1 text-sm text-red-600 font-handwriting\">{errors.email.message}</p>",
              "                            <p id=\"register-email-error\" role=\"alert\" className=\"mt-1 text-sm text-red-600 font-handwriting\">{errors.email.message}</p>",
              'register email error')
          register = replace_once(register,
              "                                {...register('password')}\n                                className={`relative block w-full",
              "                                {...register('password')}\n                                aria-invalid={Boolean(errors.password)}\n                                aria-describedby={errors.password ? 'register-password-error' : undefined}\n                                className={`relative block w-full",
              'register password aria')
          register = replace_once(register,
              "                                onClick={() => setShowPassword(!showPassword)}\n                                className=\"absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-900 transition focus:outline-none\"",
              "                                onClick={() => setShowPassword(!showPassword)}\n                                aria-label={showPassword ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'}\n                                aria-pressed={showPassword}\n                                className=\"absolute right-1 top-1/2 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-md text-gray-500 transition hover:bg-gray-100 hover:text-gray-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-inset\"",
              'register password toggle')
          register = replace_once(register,
              "                            <p className=\"mt-1 text-sm text-red-600 font-handwriting\">{errors.password.message}</p>",
              "                            <p id=\"register-password-error\" role=\"alert\" className=\"mt-1 text-sm text-red-600 font-handwriting\">{errors.password.message}</p>",
              'register password error')
          register_path.write_text(register)

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/auth/LoginForm.tsx components/auth/RegisterForm.tsx
          git diff --cached --check
          git commit -m "fix(px): improve auth keyboard accessibility"
          git push origin HEAD:feat/product-experience-v1-1
