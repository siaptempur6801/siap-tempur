name: CPNS Source Secret Check Once

on:
  pull_request:
    branches:
      - feat/schema-v2
    paths:
      - .github/workflows/cpns-source-secret-check-once.yml

permissions:
  contents: read

jobs:
  check:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require existing CPNS legacy source read credential
        shell: bash
        env:
          SOURCE_KEY: ${{ secrets.CPNS_LEGACY_SOURCE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_KEY}" ]; then
            echo "CPNS_LEGACY_SOURCE_SERVICE_ROLE_KEY is not configured"
            exit 2
          fi
          echo "CPNS legacy source credential is configured"
