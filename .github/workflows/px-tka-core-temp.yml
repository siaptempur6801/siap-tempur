name: PX TKA core cleanup (temporary)

on:
  push:
    branches:
      - feat/product-experience-v1-1
    paths:
      - .github/workflows/px-tka-core-temp.yml

permissions:
  contents: write

jobs:
  patch-tka-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-experience-v1-1
          fetch-depth: 0

      - name: Apply controlled TKA Product Experience replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/tka/[level]/page.tsx')
          text = path.read_text()

          replacements = [
              ("'Blueprint TKA SMP 2026 memakai Matematika dan Bahasa Indonesia sebagai mata uji resmi. Bahasa Inggris dan IPA tetap tersedia sebagai pengayaan di SiapTempur.'", "'Untuk TKA SMP, SiapTempur memusatkan latihan pada Matematika dan Bahasa Indonesia. Bahasa Inggris dan IPA tersedia sebagai materi pengayaan.'"),
              ("'Track ini memakai catalog, bank soal, progress, attempt, dan entitlement yang terpisah dari CPNS/SKD.'", "'Setiap jenjang memiliki latihan, hasil, dan perkembangan belajar yang tersimpan terpisah dari persiapan CPNS.'"),
              ("> Track aktif</span>", "> Jalur belajar aktif</span>"),
              ("Jalur TKA {level} berhasil diaktifkan untuk akun ini.", "Jalur belajar TKA {level} sudah aktif di akunmu."),
              ("Aktivasi membuat progress jenjang ini disimpan di user_tracks. Data sekolah bersifat opsional.", "Aktifkan jalur ini agar hasil latihan dan tryout tersimpan dalam akunmu. Data sekolah boleh dikosongkan."),
              ("Aktifkan TKA {level}", "Aktifkan jalur belajar"),
              ("Bank soal dan progress dihitung per subject di track {level}.", "Pilih mata pelajaran untuk melihat materi yang tersedia di jenjang ini."),
              ("{questionCountBySubject.get(subject.id) ?? 0} soal {stagingSmpPilot ? 'approved' : 'published'} tersedia.", "{questionCountBySubject.get(subject.id) ?? 0} soal tersedia untuk latihan."),
              ("'Full Tryout dan Mini Tryout TKA SMP dibuka di staging untuk validasi end-to-end. Mini memiliki satu percobaan gratis; payment dan Tempur Pass tetap menjadi tahap monetisasi terpisah.'", "'Pilih Mini Tryout untuk mengukur satu mata pelajaran atau Full Tryout untuk mengukur kemampuan dalam sesi yang lebih lengkap.'"),
              ("'Mini Tryout memiliki satu percobaan gratis per mapel. Setelah kuota gratis habis, Mini unlimited dan Full Tryout membutuhkan Tempur Pass aktif.'", "'Mini Tryout memiliki satu kesempatan gratis per mata pelajaran. Akses lanjutan dan Full Tryout mengikuti paket yang aktif di akunmu.'"),
              ("? 'Staging pilot · Gratis'", "? 'Akses uji coba'"),
              ("!activeTrack ? 'Aktifkan track terlebih dahulu'", "!activeTrack ? 'Aktifkan jalur belajar terlebih dahulu'"),
              ("type?.name || type?.code || 'Exam'", "type?.name || type?.code || 'Tryout'"),
              ("Konfigurasi draft tidak ditampilkan sampai bank soal dan QA selesai.", "Pilihan tryout akan muncul di sini setelah siap digunakan."),
              ("Lanjutkan attempt yang belum selesai atau buka kembali hasil dan pembahasan.", "Lanjutkan pengerjaan yang belum selesai atau buka kembali hasil dan pembahasan."),
              ("Percobaan #{attempt.attempt_number}", "Pengerjaan #{attempt.attempt_number}"),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 occurrence, found {count}: {old[:120]}')
              text = text.replace(old, new, 1)

          anchor = """                {!activeTrack && (\n                    <section className=\"border-2 border-gray-900 bg-yellow-50 p-5 shadow-[4px_4px_0_0_#111]\">"""
          if text.count(anchor) != 1:
              raise SystemExit('Active-track activation anchor mismatch')

          quick_actions = """                {activeTrack && (\n                    <section aria-label=\"Lanjutkan belajar TKA\" className=\"grid gap-3 md:grid-cols-3\">\n                        <Link\n                            href={`${path}/progress`}\n                            className=\"group border-2 border-gray-900 bg-white p-5 shadow-[3px_3px_0_0_#111] transition hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-none\"\n                        >\n                            <History size={22} className=\"text-blue-700\" />\n                            <h2 className=\"mt-4 text-lg font-black\">Perkembangan belajar</h2>\n                            <p className=\"mt-2 text-sm font-semibold leading-relaxed text-gray-600\">Lihat hasil latihan dan perubahan kemampuanmu dari waktu ke waktu.</p>\n                            <span className=\"mt-4 inline-flex items-center gap-1 text-sm font-black text-blue-700\">Lihat perkembangan <ArrowRight size={15}/></span>\n                        </Link>\n                        <Link\n                            href={`${path}/wrong-questions`}\n                            className=\"group border-2 border-gray-900 bg-white p-5 shadow-[3px_3px_0_0_#111] transition hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-none\"\n                        >\n                            <BookOpenCheck size={22} className=\"text-yellow-700\" />\n                            <h2 className=\"mt-4 text-lg font-black\">Soal yang perlu diulang</h2>\n                            <p className=\"mt-2 text-sm font-semibold leading-relaxed text-gray-600\">Kembali ke soal yang masih perlu kamu pahami dan pelajari pembahasannya.</p>\n                            <span className=\"mt-4 inline-flex items-center gap-1 text-sm font-black text-blue-700\">Ulangi soal <ArrowRight size={15}/></span>\n                        </Link>\n                        <Link\n                            href={`${path}/remedial`}\n                            className=\"group border-2 border-gray-900 bg-white p-5 shadow-[3px_3px_0_0_#111] transition hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-none\"\n                        >\n                            <CheckCircle2 size={22} className=\"text-green-700\" />\n                            <h2 className=\"mt-4 text-lg font-black\">Latihan perbaikan</h2>\n                            <p className=\"mt-2 text-sm font-semibold leading-relaxed text-gray-600\">Fokuskan latihan pada bagian yang masih lemah sebelum mencoba tryout berikutnya.</p>\n                            <span className=\"mt-4 inline-flex items-center gap-1 text-sm font-black text-blue-700\">Mulai perbaikan <ArrowRight size={15}/></span>\n                        </Link>\n                    </section>\n                )}\n\n"""
          text = text.replace(anchor, quick_actions + anchor, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- app/tka/[level]/page.tsx

      - name: Commit TKA core cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/tka/[level]/page.tsx'
          git commit -m "refactor(px): simplify TKA SMP core experience"
          git push origin HEAD:feat/product-experience-v1-1
