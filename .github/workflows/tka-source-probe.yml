name: TKA Source Probe

on:
  push:
    branches:
      - feat/schema-v2
    paths:
      - '.github/workflows/tka-source-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SOURCE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/schema-v2

      - name: Probe legacy TKA SD source
        id: probe
        shell: bash
        run: |
          mkdir -p tmp
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const result = { source_ok: false, subjects: [], questions: 0, error: null }
          const url = process.env.SOURCE_URL?.trim()
          const key = process.env.SOURCE_SERVICE_ROLE_KEY?.trim()

          const write = () => fs.writeFileSync(
            'tmp/tka-source-probe-result.json',
            `${JSON.stringify(result, null, 2)}\n`,
          )

          try {
            if (!url || !key) throw new Error('SOURCE_CREDENTIALS_MISSING')
            const headers = { apikey: key, Authorization: `Bearer ${key}` }
            const api = url.replace(/\/$/, '') + '/rest/v1'

            const programResponse = await fetch(`${api}/programs?slug=eq.tka-sd&select=id&limit=2`, { headers })
            if (!programResponse.ok) throw new Error(`PROGRAM_QUERY_FAILED_${programResponse.status}`)
            const programs = await programResponse.json()
            if (programs.length !== 1) throw new Error(`TKA_SD_PROGRAM_COUNT_${programs.length}`)

            const programId = programs[0].id
            const subjectResponse = await fetch(`${api}/subjects?program_id=eq.${programId}&select=id,code`, { headers })
            if (!subjectResponse.ok) throw new Error(`SUBJECT_QUERY_FAILED_${subjectResponse.status}`)
            const subjects = await subjectResponse.json()
            result.subjects = subjects.map((row) => row.code).sort()

            const ids = subjects.map((row) => row.id).join(',')
            const questionResponse = await fetch(
              `${api}/questions?program_id=eq.${programId}&subject_id=in.(${ids})&select=id`,
              { headers: { ...headers, Prefer: 'count=exact', Range: '0-0' } },
            )
            if (!questionResponse.ok) throw new Error(`QUESTION_QUERY_FAILED_${questionResponse.status}`)
            const contentRange = questionResponse.headers.get('content-range') || ''
            const count = Number(contentRange.split('/')[1])
            if (!Number.isFinite(count)) throw new Error('QUESTION_COUNT_UNAVAILABLE')
            result.questions = count
            if (count !== 213) throw new Error(`SOURCE_COUNT_MISMATCH_${count}`)

            result.source_ok = true
          } catch (error) {
            result.error = error instanceof Error ? error.message : 'UNKNOWN_ERROR'
          }

          write()
          console.log(JSON.stringify(result))
          NODE

      - name: Commit probe result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/tka-source-probe-result.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record TKA source probe"
          git push origin HEAD:feat/schema-v2

      - name: Require valid legacy source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const result = JSON.parse(fs.readFileSync('tmp/tka-source-probe-result.json', 'utf8'))
          if (!result.source_ok || result.questions !== 213) {
            throw new Error(`TKA_SOURCE_PROBE_FAILED:${result.error || result.questions}`)
          }
          NODE
