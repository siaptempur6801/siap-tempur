name: Schema V2 CI

on:
  push:
    branches:
      - feat/schema-v2
  pull_request:
    branches:
      - main
    paths:
      - 'app/actions/practice.ts'
      - 'app/api/practice-sessions/**'
      - 'app/cpns/dashboard/tryout/**'
      - 'src/repositories/**'
      - 'src/services/**'
      - 'src/auth/**'
      - 'lib/env.ts'
      - 'lib/utils/supabase/**'
      - 'types/database.types.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  migrate-tka-sd:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SOURCE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TARGET_INGEST_URL: https://lpgrivowdcepcxradavu.supabase.co/functions/v1/tka-sd-migration-ingest
      OIDC_AUDIENCE: siaptempur-tka-sd-staging-migration
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/schema-v2

      - name: Detect migration marker
        id: marker
        shell: bash
        run: |
          if [ -f tmp/run-tka-sd-migration ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Transfer legacy TKA SD to staging
        id: migrate
        if: steps.marker.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p tmp
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const EXPECTED = {
            questions: 213,
            options: 914,
            stimuli: 33,
            explanations: 213,
            published: 202,
            byType: { single_choice: 153, multiple_choice: 29, category: 31 },
            bySubject: { MTK: 70, BIND: 83, BING: 60 },
          }

          const resultPath = 'tmp/tka-sd-migration-result.json'
          const result = {
            success: false,
            source_ok: false,
            source_summary: null,
            staging_response: null,
            error: null,
          }
          const writeResult = () => fs.writeFileSync(resultPath, `${JSON.stringify(result, null, 2)}\n`)

          function chunks(rows, size) {
            const out = []
            for (let i = 0; i < rows.length; i += size) out.push(rows.slice(i, i + size))
            return out
          }

          try {
            const sourceUrl = process.env.SOURCE_URL?.trim()?.replace(/\/$/, '')
            const sourceKey = process.env.SOURCE_SERVICE_ROLE_KEY?.trim()
            const targetUrl = process.env.TARGET_INGEST_URL?.trim()
            const audience = process.env.OIDC_AUDIENCE?.trim()
            if (!sourceUrl || !sourceKey) throw new Error('SOURCE_CREDENTIALS_MISSING')
            if (!targetUrl || !audience) throw new Error('TARGET_CONFIGURATION_MISSING')

            const api = `${sourceUrl}/rest/v1`
            const sourceHeaders = { apikey: sourceKey, Authorization: `Bearer ${sourceKey}` }
            const getRows = async (path) => {
              const response = await fetch(`${api}/${path}`, { headers: sourceHeaders })
              if (!response.ok) throw new Error(`SOURCE_QUERY_FAILED_${response.status}:${path.split('?')[0]}`)
              return response.json()
            }

            const programs = await getRows('programs?slug=eq.tka-sd&select=id&limit=2')
            if (programs.length !== 1) throw new Error(`SOURCE_TKA_SD_PROGRAM_COUNT_${programs.length}`)
            const programId = programs[0].id
            const subjects = await getRows(`subjects?program_id=eq.${programId}&select=id,code,name&order=code.asc`)
            const subjectIds = subjects.map((row) => row.id)
            if (subjectIds.length !== 3) throw new Error(`SOURCE_SUBJECT_COUNT_${subjectIds.length}`)

            const questionSelect = [
              'id','question_code','subject_id','content','explanation','category','sub_category','image_url',
              'status','version','response_type','cognitive_level','difficulty','source','stimulus_id','stimulus_order',
              'created_at','updated_at','published_at',
            ].join(',')
            const questions = await getRows(
              `questions?program_id=eq.${programId}&subject_id=in.(${subjectIds.join(',')})&select=${questionSelect}&order=question_code.asc`,
            )
            const questionIds = questions.map((row) => row.id)

            const options = []
            for (const ids of chunks(questionIds, 40)) {
              const rows = await getRows(
                `options?question_id=in.(${ids.join(',')})&select=id,question_id,content,is_correct,score_value,image_url,sort_order,response_group,response_group_order,created_at&order=question_id.asc,sort_order.asc`,
              )
              options.push(...rows)
            }

            const stimulusIds = [...new Set(questions.map((row) => row.stimulus_id).filter(Boolean))]
            const stimuli = []
            for (const ids of chunks(stimulusIds, 40)) {
              const rows = await getRows(
                `question_stimuli?id=in.(${ids.join(',')})&select=id,subject_id,title,content,image_url,source,created_at,updated_at&order=id.asc`,
              )
              stimuli.push(...rows)
            }

            const subjectById = new Map(subjects.map((row) => [row.id, row.code]))
            const byType = {}
            const bySubject = {}
            for (const question of questions) {
              byType[question.response_type] = (byType[question.response_type] ?? 0) + 1
              const code = subjectById.get(question.subject_id) ?? 'UNKNOWN'
              bySubject[code] = (bySubject[code] ?? 0) + 1
            }
            const summary = {
              questions: questions.length,
              options: options.length,
              stimuli: stimuli.length,
              explanations: questions.filter((row) => typeof row.explanation === 'string' && row.explanation.trim()).length,
              published: questions.filter((row) => String(row.status).toLowerCase() === 'published').length,
              byType,
              bySubject,
            }
            result.source_summary = summary

            const mismatches = []
            for (const key of ['questions','options','stimuli','explanations','published']) {
              if (summary[key] !== EXPECTED[key]) mismatches.push(`${key}:${summary[key]}!=${EXPECTED[key]}`)
            }
            for (const [key, expected] of Object.entries(EXPECTED.byType)) {
              if ((summary.byType[key] ?? 0) !== expected) mismatches.push(`type.${key}:${summary.byType[key] ?? 0}!=${expected}`)
            }
            for (const [key, expected] of Object.entries(EXPECTED.bySubject)) {
              if ((summary.bySubject[key] ?? 0) !== expected) mismatches.push(`subject.${key}:${summary.bySubject[key] ?? 0}!=${expected}`)
            }
            if (mismatches.length) throw new Error(`SOURCE_RECONCILIATION_MISMATCH:${mismatches.join('|')}`)
            result.source_ok = true

            const oidcRequestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL
            const oidcRequestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN
            if (!oidcRequestUrl || !oidcRequestToken) throw new Error('GITHUB_OIDC_ENV_MISSING')
            const oidcUrl = new URL(oidcRequestUrl)
            oidcUrl.searchParams.set('audience', audience)
            const oidcResponse = await fetch(oidcUrl, {
              headers: { Authorization: `bearer ${oidcRequestToken}` },
            })
            if (!oidcResponse.ok) throw new Error(`GITHUB_OIDC_REQUEST_FAILED_${oidcResponse.status}`)
            const oidcBody = await oidcResponse.json()
            const oidcToken = oidcBody.value
            if (!oidcToken) throw new Error('GITHUB_OIDC_TOKEN_MISSING')

            const ingestResponse = await fetch(targetUrl, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${oidcToken}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ subjects, questions, options, stimuli }),
            })
            const ingestText = await ingestResponse.text()
            let ingestBody
            try { ingestBody = JSON.parse(ingestText) } catch { ingestBody = { raw: ingestText.slice(0, 1000) } }
            result.staging_response = ingestBody
            if (!ingestResponse.ok || ingestBody?.success !== true) {
              throw new Error(`STAGING_INGEST_FAILED_${ingestResponse.status}:${ingestBody?.error ?? 'unknown'}`)
            }

            result.success = true
          } catch (error) {
            result.error = error instanceof Error ? error.message : String(error)
          }

          writeResult()
          console.log(JSON.stringify({ success: result.success, source_ok: result.source_ok, source_summary: result.source_summary, error: result.error }))
          if (!result.success) process.exitCode = 1
          NODE

      - name: Record migration result and retire marker
        if: always() && steps.marker.outputs.run == 'true'
        shell: bash
        run: |
          rm -f tmp/run-tka-sd-migration
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp
          git diff --cached --quiet && exit 0
          git commit -m "chore: record TKA SD migration result"
          git push origin HEAD:feat/schema-v2

      - name: Fail job when migration failed
        if: steps.marker.outputs.run == 'true' && steps.migrate.outcome != 'success'
        shell: bash
        run: exit 1
