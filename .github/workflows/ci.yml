name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    # Standard release verification must not depend on the intermittently-offline
    # self-hosted Mac runner. Dedicated staging E2E workflows keep their own
    # environment/OIDC boundaries.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      APP_ENV: staging
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_SUPABASE_URL: https://lpgrivowdcepcxradavu.supabase.co
      NEXT_PUBLIC_SUPABASE_EXPECTED_PROJECT_REF: lpgrivowdcepcxradavu
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_9MDt_8bH6lsECYEaX9zqeg_6Upvnpaf
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_9MDt_8bH6lsECYEaX9zqeg_6Upvnpaf
      # Standard CI must not have an admin-capable database credential. Dedicated
      # staging E2E uses GitHub OIDC in its separate workflow.
      SUPABASE_SERVICE_ROLE_KEY: ci-no-service-role
      MIDTRANS_SERVER_KEY_SANDBOX: ci-not-used
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY_SANDBOX: ci-not-used
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      E2E_PARTICIPANT_EMAIL: ''
      E2E_PARTICIPANT_PASSWORD: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Security audit
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=critical

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
