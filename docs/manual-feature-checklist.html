<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manual Feature Checklist - SiapTempur</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --paper: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 0 -16px 24px;
      padding: 16px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(12px);
    }

    .toolbar,
    section {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 1px 2px rgb(15 23 42 / 0.04);
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      line-height: 1.1;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding: 12px;
    }

    .progress {
      min-width: 220px;
      font-weight: 800;
    }

    progress {
      width: 160px;
      height: 12px;
      accent-color: var(--accent);
      vertical-align: middle;
    }

    button {
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      padding: 8px 12px;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .sections {
      display: grid;
      gap: 16px;
    }

    section {
      padding: 18px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.1rem;
    }

    label {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 8px 0;
      color: var(--text);
      font-weight: 600;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    label:has(input:checked) {
      color: var(--muted);
      text-decoration: line-through;
    }

    textarea,
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
    }

    .notes {
      display: grid;
      gap: 12px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Manual Feature Checklist</h1>
      <p class="subtitle">Smoke test fitur SiapTempur sebelum release atau setelah perubahan besar.</p>
      <div class="toolbar">
        <div class="progress">
          <span id="progressText">0/0 selesai</span>
          <progress id="progressBar" value="0" max="100"></progress>
        </div>
        <div>
          <button type="button" id="checkAll">Centang semua</button>
          <button type="button" id="clearAll">Reset</button>
          <button type="button" class="primary" id="copyMarkdown">Copy Markdown</button>
        </div>
      </div>
    </header>

    <div class="sections" id="checklist"></div>
  </main>

  <script>
    const storageKey = "siap-tempur-manual-feature-checklist-v1";
    const notesKey = "siap-tempur-manual-feature-checklist-notes-v1";

    const sections = [
      ["Akses Dasar", [
        "Buka `/`",
        "Landing page tampil styled, bukan HTML polos",
        "Navigasi header jalan: Program, Kenapa berbeda, Cara kerja, Fitur, Artikel",
        "Tombol `Masuk` menuju `/login`",
        "Tombol `Mulai belajar gratis` menuju `/register`",
        "Buka lewat `http://localhost:3000`",
        "Buka lewat IP LAN, misalnya `http://192.168.1.6:3000`, CSS tetap tampil normal",
      ]],
      ["Auth", [
        "Register user baru di `/register`",
        "Login user di `/login`",
        "Logout dari dashboard",
        "Akses `/cpns/dashboard` tanpa login diarahkan ke `/login`",
        "Setelah login, user diarahkan balik ke halaman tujuan",
        "Forgot password `/forgot-password` tampil",
        "Reset password `/auth/reset-password` tampil",
      ]],
      ["Dashboard CPNS", [
        "Buka `/cpns/dashboard`",
        "Nama/profile user tampil",
        "Ringkasan skor/progres tampil tanpa runtime error",
        "Token/kuota tampil",
        "Streak/ranking tampil atau fallback aman",
        "Riwayat terakhir tampil atau empty state rapi",
        "Sidebar/menu dashboard bisa dibuka di mobile",
        "Tidak ada error Supabase di terminal",
      ]],
      ["Drilling Materi", [
        "Buka `/cpns/dashboard/drilling-materi`",
        "Daftar materi TWK/TIU/TKP tampil",
        "Jumlah soal per materi tampil",
        "Klik mulai drilling",
        "Jika token tidak cukup, tampil pesan jelas",
        "Jika sesi aktif ada, tombol lanjutkan tampil",
        "Tidak muncul error `HeadersOverflowError`",
      ]],
      ["Mini Tryout", [
        "Buka `/cpns/dashboard/mini-tryout`",
        "Pilihan TWK/TIU/TKP tampil",
        "Mulai mini tryout",
        "Soal tampil berurutan",
        "Jawaban bisa dipilih",
        "Navigasi nomor soal jalan",
        "Submit selesai",
        "Hasil mini tryout tampil",
      ]],
      ["Full Tryout", [
        "Buka `/cpns/dashboard/tryout`",
        "Mulai full tryout",
        "Timer tampil dan berjalan",
        "Jawaban tersimpan saat pindah soal",
        "Refresh halaman lalu sesi bisa dilanjutkan",
        "Submit tryout",
        "Hasil total TWK/TIU/TKP tampil",
        "Status lulus/tidak lulus sesuai passing grade",
      ]],
      ["Result Dan Riwayat", [
        "Buka `/cpns/dashboard/riwayat`",
        "Riwayat attempt tampil",
        "Klik detail hasil",
        "Pembahasan tampil",
        "Jawaban benar/salah jelas",
        "Skor per kategori konsisten",
        "User tidak bisa membuka result milik user lain",
      ]],
      ["Ranking", [
        "Buka `/cpns/dashboard/ranking`",
        "Leaderboard tampil",
        "Rank user tampil bila ada data",
        "Empty state aman bila belum ada ranking",
        "Ranking tidak berubah karena refresh biasa",
        "Skor ranking sesuai hasil valid",
      ]],
      ["Event / Tryout Akbar", [
        "Buka `/cpns/dashboard/event`",
        "Event aktif/scheduled tampil",
        "Detail event bisa dibuka",
        "Register/join event berjalan",
        "Event live hanya bisa diakses sesuai waktu",
        "Submit event menghasilkan skor",
        "Ranking event tampil",
        "User tidak bisa ikut event tanpa entitlement/token jika aturan mewajibkan",
      ]],
      ["Beli Paket / Payment", [
        "Buka `/cpns/dashboard/beli-paket`",
        "Paket produk tampil",
        "Klik beli paket",
        "Midtrans script loaded tanpa console error",
        "Sandbox payment bisa dibuat",
        "QRIS/Snap token muncul",
        "Setelah pembayaran sukses, token/entitlement bertambah",
        "Jika Midtrans env dummy, error tampil jelas dan tidak crash",
      ]],
      ["Profile", [
        "Buka `/cpns/dashboard/profile`",
        "Data user tampil",
        "Edit nama/profile jika tersedia",
        "Upload avatar jika tersedia",
        "History aktivitas tampil",
        "Data user lain tidak bisa diakses",
      ]],
      ["Admin", [
        "Login sebagai admin",
        "Buka `/admin`",
        "User non-admin tidak bisa masuk admin",
        "Buka `/admin/content/questions`",
        "Buat soal baru",
        "Edit soal",
        "Hapus/arsip soal sesuai fitur",
        "Opsi jawaban tersimpan benar",
        "Pembahasan tersimpan",
        "Validasi form admin jalan",
      ]],
      ["Admin Artikel", [
        "Buka `/admin/content/articles`",
        "Buat artikel",
        "Edit artikel",
        "Publish/unpublish artikel",
        "Buka `/blog`",
        "Artikel publish tampil",
        "Artikel draft tidak tampil untuk publik",
      ]],
      ["Admin Exam / Event / Commerce", [
        "Buka `/admin/assessment/exams`",
        "Exam config tampil",
        "Buka `/admin/assessment/events`",
        "Event config tampil",
        "Buka `/admin/commerce/products`",
        "Produk/paket tampil",
        "Harga dan grant wallet sesuai konfigurasi",
        "User biasa tidak bisa akses server action admin",
      ]],
      ["TKA", [
        "Buka `/tka`",
        "Buka level TKA yang tersedia, misalnya `/tka/smp`",
        "Diagnostic bisa dimulai",
        "Soal diagnostic tampil",
        "Submit diagnostic",
        "Result diagnostic tampil",
        "Progress page tampil",
        "Wrong questions tampil",
        "Remedial session bisa dibuka",
      ]],
      ["Security Manual", [
        "Coba akses dashboard tanpa login",
        "Coba akses admin sebagai user biasa",
        "Coba buka result/session ID milik user lain",
        "Coba manipulasi token/score dari browser devtools",
        "Coba submit attempt dua kali",
        "Coba refresh saat ujian berjalan",
        "Coba buka route API/server action langsung",
        "Pastikan tidak ada secret tampil di browser bundle",
        "Pastikan `.env.local` tidak ter-commit",
      ]],
      ["Command Akhir", [
        "`npm run lint`",
        "`npm run typecheck`",
        "`npm run build`",
      ]],
    ];

    const state = JSON.parse(localStorage.getItem(storageKey) || "{}");
    const noteState = JSON.parse(localStorage.getItem(notesKey) || "{}");
    const root = document.getElementById("checklist");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("`", "");
    }

    function render() {
      root.innerHTML = "";
      let index = 0;
      for (const [title, items] of sections) {
        const section = document.createElement("section");
        section.innerHTML = `<h2>${escapeHtml(title)}</h2>`;
        for (const item of items) {
          const id = `item-${index}`;
          const label = document.createElement("label");
          label.innerHTML = `<input type="checkbox" id="${id}" ${state[id] ? "checked" : ""}> <span>${escapeHtml(item)}</span>`;
          section.append(label);
          index += 1;
        }
        root.append(section);
      }

      const notes = document.createElement("section");
      notes.className = "notes";
      notes.innerHTML = `
        <h2>Catatan QA</h2>
        <input type="text" id="note-date" placeholder="Tanggal" value="${escapeHtml(noteState.date || "")}">
        <input type="text" id="note-tester" placeholder="Tester" value="${escapeHtml(noteState.tester || "")}">
        <input type="text" id="note-env" placeholder="Environment" value="${escapeHtml(noteState.env || "")}">
        <textarea id="note-body" rows="6" placeholder="Catatan">${escapeHtml(noteState.body || "")}</textarea>
      `;
      root.append(notes);
      updateProgress();
    }

    function updateProgress() {
      const boxes = [...document.querySelectorAll('input[type="checkbox"]')];
      const checked = boxes.filter((box) => box.checked).length;
      progressText.textContent = `${checked}/${boxes.length} selesai`;
      progressBar.max = boxes.length;
      progressBar.value = checked;
    }

    function saveNotes() {
      localStorage.setItem(notesKey, JSON.stringify({
        date: document.getElementById("note-date")?.value || "",
        tester: document.getElementById("note-tester")?.value || "",
        env: document.getElementById("note-env")?.value || "",
        body: document.getElementById("note-body")?.value || "",
      }));
    }

    function toMarkdown() {
      const lines = ["# Manual Feature Checklist", ""];
      let index = 0;
      for (const [title, items] of sections) {
        lines.push(`## ${title}`, "");
        for (const item of items) {
          const checked = document.getElementById(`item-${index}`).checked ? "x" : " ";
          lines.push(`- [${checked}] ${item}`);
          index += 1;
        }
        lines.push("");
      }
      lines.push("## Catatan QA", "");
      lines.push(`Tanggal: ${document.getElementById("note-date").value}`);
      lines.push("");
      lines.push(`Tester: ${document.getElementById("note-tester").value}`);
      lines.push("");
      lines.push(`Environment: ${document.getElementById("note-env").value}`);
      lines.push("");
      lines.push("Catatan:");
      lines.push("");
      lines.push(document.getElementById("note-body").value);
      lines.push("");
      return lines.join("\n");
    }

    render();

    document.addEventListener("change", (event) => {
      if (event.target.matches('input[type="checkbox"]')) {
        state[event.target.id] = event.target.checked;
        localStorage.setItem(storageKey, JSON.stringify(state));
        updateProgress();
      }
      if (event.target.matches("#note-date, #note-tester, #note-env, #note-body")) {
        saveNotes();
      }
    });

    document.addEventListener("input", (event) => {
      if (event.target.matches("#note-date, #note-tester, #note-env, #note-body")) {
        saveNotes();
      }
    });

    document.getElementById("checkAll").addEventListener("click", () => {
      document.querySelectorAll('input[type="checkbox"]').forEach((box) => {
        box.checked = true;
        state[box.id] = true;
      });
      localStorage.setItem(storageKey, JSON.stringify(state));
      updateProgress();
    });

    document.getElementById("clearAll").addEventListener("click", () => {
      document.querySelectorAll('input[type="checkbox"]').forEach((box) => {
        box.checked = false;
        state[box.id] = false;
      });
      localStorage.setItem(storageKey, JSON.stringify(state));
      updateProgress();
    });

    document.getElementById("copyMarkdown").addEventListener("click", async () => {
      await navigator.clipboard.writeText(toMarkdown());
    });
  </script>
</body>
</html>
