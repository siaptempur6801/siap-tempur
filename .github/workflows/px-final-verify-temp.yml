name: PX final verification (temporary)

on:
  push:
    branches:
      - feat/product-experience-v1-1
    paths:
      - .github/workflows/px-final-verify-temp.yml

permissions:
  contents: read

env:
  CI: 'true'
  APP_ENV: staging
  NEXT_PUBLIC_APP_ENV: staging
  NEXT_PUBLIC_SUPABASE_URL: https://lpgrivowdcepcxradavu.supabase.co
  NEXT_PUBLIC_SUPABASE_EXPECTED_PROJECT_REF: lpgrivowdcepcxradavu
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_9MDt_8bH6lsECYEaX9zqeg_6Upvnpaf
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_9MDt_8bH6lsECYEaX9zqeg_6Upvnpaf
  SUPABASE_SERVICE_ROLE_KEY: ci-no-service-role
  MIDTRANS_SERVER_KEY_SANDBOX: ci-not-used
  NEXT_PUBLIC_MIDTRANS_CLIENT_KEY_SANDBOX: ci-not-used
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  E2E_PARTICIPANT_EMAIL: ''
  E2E_PARTICIPANT_PASSWORD: ''

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/product-experience-v1-1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: px-final-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
