name: PX funnel instrumentation (temporary)

on:
  push:
    branches:
      - feat/product-experience-v1-1
    paths:
      - .github/workflows/px-funnel-instrument-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-experience-v1-1

      - name: Instrument funnel events
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          landing_path = Path('components/home/CpnsProductLandingV11.tsx')
          landing = landing_path.read_text()
          landing = replace_once(
              landing,
              "import { Button } from '@/components/ui/Button'",
              "import { Button } from '@/components/ui/Button'\nimport TrackedLink from '@/components/analytics/TrackedLink'",
              'landing analytics import',
          )
          landing = replace_once(
              landing,
              "        cta: 'Mulai latihan fokus',\n        surface: 'bg-yellow-50',",
              "        cta: 'Mulai latihan fokus',\n        mode: 'latihan_fokus',\n        surface: 'bg-yellow-50',",
              'landing focus mode',
          )
          landing = replace_once(
              landing,
              "        cta: 'Lihat mini tryout',\n        surface: 'bg-cyan-50',",
              "        cta: 'Lihat mini tryout',\n        mode: 'mini_tryout',\n        surface: 'bg-cyan-50',",
              'landing mini mode',
          )
          landing = replace_once(
              landing,
              "        cta: 'Lihat full tryout',\n        surface: 'bg-blue-50',",
              "        cta: 'Lihat full tryout',\n        mode: 'full_tryout',\n        surface: 'bg-blue-50',",
              'landing full mode',
          )
          landing = replace_once(
              landing,
              "                            <Link href={primaryAccountHref}>{user ? 'Buka dashboard' : 'Mulai belajar'}</Link>",
              "                            <TrackedLink\n                                href={primaryAccountHref}\n                                eventName=\"px_landing_cta\"\n                                eventProperties={{ program: 'cpns', surface: 'landing', cta: user ? 'header_dashboard' : 'header_start' }}\n                            >\n                                {user ? 'Buka dashboard' : 'Mulai belajar'}\n                            </TrackedLink>",
              'landing header cta',
          )
          landing = replace_once(
              landing,
              "                                <Link href={primaryAccountHref}>\n                                    Mulai persiapan <ArrowRight size={18} />\n                                </Link>",
              "                                <TrackedLink\n                                    href={primaryAccountHref}\n                                    eventName=\"px_landing_cta\"\n                                    eventProperties={{ program: 'cpns', surface: 'landing', cta: 'primary_start' }}\n                                >\n                                    Mulai persiapan <ArrowRight size={18} />\n                                </TrackedLink>",
              'landing hero cta',
          )
          landing = replace_once(
              landing,
              "                        {learningModes.map(({ icon: Icon, eyebrow, title, text, href, cta, surface }) => (",
              "                        {learningModes.map(({ icon: Icon, eyebrow, title, text, href, cta, mode, surface }) => (",
              'landing mode map',
          )
          landing = replace_once(
              landing,
              "                                <Link href={href} className=\"mt-6 inline-flex items-center gap-2 font-black text-blue-700 hover:underline\">\n                                    {cta} <ArrowRight size={17} />\n                                </Link>",
              "                                <TrackedLink\n                                    href={href}\n                                    eventName=\"px_landing_cta\"\n                                    eventProperties={{ program: 'cpns', surface: 'landing', cta: `mode_${mode}`, mode }}\n                                    className=\"mt-6 inline-flex min-h-11 items-center gap-2 font-black text-blue-700 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2\"\n                                >\n                                    {cta} <ArrowRight size={17} />\n                                </TrackedLink>",
              'landing mode cta',
          )
          landing = replace_once(
              landing,
              "                                <Link href={eventHref}>Lihat event di akun</Link>",
              "                                <TrackedLink\n                                    href={eventHref}\n                                    eventName=\"px_landing_cta\"\n                                    eventProperties={{ program: 'cpns', surface: 'landing', cta: 'event' }}\n                                >\n                                    Lihat event di akun\n                                </TrackedLink>",
              'landing event cta',
          )
          landing = replace_once(
              landing,
              "                            <Link href={packageHref}>Lihat paket token</Link>",
              "                            <TrackedLink\n                                href={packageHref}\n                                eventName=\"px_landing_cta\"\n                                eventProperties={{ program: 'cpns', surface: 'landing', cta: 'token_packages' }}\n                            >\n                                Lihat paket token\n                            </TrackedLink>",
              'landing package cta',
          )
          landing_path.write_text(landing)

          login_path = Path('components/auth/LoginForm.tsx')
          login = login_path.read_text()
          login = replace_once(
              login,
              "import { resolvePostLoginRedirect, sanitizeAuthReturnTo } from '@/lib/auth-redirect'",
              "import { resolvePostLoginRedirect, sanitizeAuthReturnTo } from '@/lib/auth-redirect'\nimport { trackProductEvent } from '@/lib/product-analytics'",
              'login analytics import',
          )
          login = replace_once(
              login,
              "    const onSubmit = async (data: LoginFormData) => {\n        setLoading(true)",
              "    const onSubmit = async (data: LoginFormData) => {\n        trackProductEvent('px_auth_intent', { surface: 'auth', cta: 'login', auth_method: 'email' })\n        setLoading(true)",
              'login email intent',
          )
          login = replace_once(
              login,
              "            } else {\n                toast.success('Berhasil masuk', {",
              "            } else {\n                trackProductEvent('px_auth_success', { surface: 'auth', auth_method: 'email' })\n                toast.success('Berhasil masuk', {",
              'login success',
          )
          login = replace_once(
              login,
              "    const handleGoogleLogin = async () => {\n        setLoading(true)",
              "    const handleGoogleLogin = async () => {\n        trackProductEvent('px_auth_intent', { surface: 'auth', cta: 'login', auth_method: 'google' })\n        setLoading(true)",
              'login google intent',
          )
          login_path.write_text(login)

          register_path = Path('components/auth/RegisterForm.tsx')
          register = register_path.read_text()
          register = replace_once(
              register,
              "import { sanitizeAuthReturnTo } from '@/lib/auth-redirect'",
              "import { sanitizeAuthReturnTo } from '@/lib/auth-redirect'\nimport { trackProductEvent } from '@/lib/product-analytics'",
              'register analytics import',
          )
          register = replace_once(
              register,
              "    const onSubmit = async (data: RegisterFormData) => {\n        setLoading(true)",
              "    const onSubmit = async (data: RegisterFormData) => {\n        trackProductEvent('px_auth_intent', { surface: 'auth', cta: 'register', auth_method: 'email' })\n        setLoading(true)",
              'register email intent',
          )
          register = replace_once(
              register,
              "            } else {\n                toast.success('Akun berhasil dibuat', {",
              "            } else {\n                trackProductEvent('px_auth_success', { surface: 'auth', auth_method: 'email' })\n                toast.success('Akun berhasil dibuat', {",
              'register success',
          )
          register = replace_once(
              register,
              "    const handleGoogleLogin = async () => {\n        setLoading(true)",
              "    const handleGoogleLogin = async () => {\n        trackProductEvent('px_auth_intent', { surface: 'auth', cta: 'register', auth_method: 'google' })\n        setLoading(true)",
              'register google intent',
          )
          register_path.write_text(register)

          practice_path = Path('components/practice/PracticeSessionClient.tsx')
          practice = practice_path.read_text()
          practice = replace_once(
              practice,
              "import { acquireSingleFlightLock, releaseSingleFlightLock } from '@/lib/single-flight-lock'",
              "import { acquireSingleFlightLock, releaseSingleFlightLock } from '@/lib/single-flight-lock'\nimport { trackProductEvent } from '@/lib/product-analytics'",
              'practice analytics import',
          )
          practice = replace_once(
              practice,
              "    const sessionKindLabel = isTryout ? 'Tryout' : returnTo === 'drilling-materi' ? 'Latihan Fokus' : 'Mini Tryout'\n    const sessionKindLabelLower = sessionKindLabel.toLowerCase()",
              "    const sessionKindLabel = isTryout ? 'Tryout' : returnTo === 'drilling-materi' ? 'Latihan Fokus' : 'Mini Tryout'\n    const analyticsMode = isTryout\n        ? 'full_tryout'\n        : returnTo === 'drilling-materi'\n            ? 'latihan_fokus'\n            : returnTo === 'event'\n                ? 'event'\n                : 'mini_tryout'\n    const sessionKindLabelLower = sessionKindLabel.toLowerCase()",
              'practice analytics mode',
          )
          practice = replace_once(
              practice,
              "                clearProgressFromLocalStorage(sessionId)\n                toast.success(`${sessionKindLabel} selesai`)",
              "                clearProgressFromLocalStorage(sessionId)\n                trackProductEvent('px_exam_complete', { program: 'cpns', surface: 'exam', mode: analyticsMode })\n                toast.success(`${sessionKindLabel} selesai`)",
              'practice complete event',
          )
          practice = replace_once(
              practice,
              "    }, [resultFromQuery, sessionId, sessionKindLabel, router])",
              "    }, [analyticsMode, resultFromQuery, sessionId, sessionKindLabel, router])",
              'practice callback deps',
          )
          practice_path.write_text(practice)

      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/home/CpnsProductLandingV11.tsx components/auth/LoginForm.tsx components/auth/RegisterForm.tsx components/practice/PracticeSessionClient.tsx
          git diff --cached --check
          git commit -m "feat(px): instrument core learner funnel"
          git push origin HEAD:feat/product-experience-v1-1
