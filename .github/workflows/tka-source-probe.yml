name: TKA Source Probe

on:
  push:
    branches:
      - feat/schema-v2
    paths:
      - '.github/workflows/tka-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SOURCE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Probe legacy TKA SD source
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js'
          const url = process.env.SOURCE_URL?.trim()
          const key = process.env.SOURCE_SERVICE_ROLE_KEY?.trim()
          if (!url || !key) throw new Error('SOURCE_CREDENTIALS_MISSING')
          const db = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } })
          const { data: program, error: pe } = await db.from('programs').select('id').eq('slug', 'tka-sd').maybeSingle()
          if (pe) throw pe
          if (!program) throw new Error('TKA_SD_PROGRAM_NOT_FOUND')
          const { data: subjects, error: se } = await db.from('subjects').select('id,code').eq('program_id', program.id)
          if (se) throw se
          const subjectIds = subjects.map((row) => row.id)
          const { count, error: qe } = await db.from('questions').select('id', { head: true, count: 'exact' }).eq('program_id', program.id).in('subject_id', subjectIds)
          if (qe) throw qe
          console.log(JSON.stringify({ source_ok: true, subjects: subjects.map((row) => row.code).sort(), questions: count ?? 0 }))
          if ((count ?? 0) !== 213) throw new Error(`SOURCE_COUNT_MISMATCH:${count ?? 0}`)
          NODE
