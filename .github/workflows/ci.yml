name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      APP_ENV: staging
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_SUPABASE_URL: https://lpgrivowdcepcxradavu.supabase.co
      NEXT_PUBLIC_SUPABASE_EXPECTED_PROJECT_REF: lpgrivowdcepcxradavu
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_9MDt_8bH6lsECYEaX9zqeg_6Upvnpaf
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_9MDt_8bH6lsECYEaX9zqeg_6Upvnpaf
      # Standard CI must not have an admin-capable database credential. Dedicated
      # staging E2E uses STAGING_SUPABASE_SERVICE_ROLE_KEY in its separate workflow.
      SUPABASE_SERVICE_ROLE_KEY: ci-no-service-role
      MIDTRANS_SERVER_KEY_SANDBOX: ci-not-used
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY_SANDBOX: ci-not-used
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      E2E_PARTICIPANT_EMAIL: ''
      E2E_PARTICIPANT_PASSWORD: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # package-lock normalization is tracked separately; current repository
        # installs successfully with npm install and CI must not rewrite the lockfile.
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Security audit
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=critical

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
