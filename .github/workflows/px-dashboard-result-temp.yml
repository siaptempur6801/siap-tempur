name: PX dashboard result instrumentation (temporary)

on:
  push:
    branches:
      - feat/product-experience-v1-1
    paths:
      - .github/workflows/px-dashboard-result-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-experience-v1-1

      - name: Instrument dashboard and result actions
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          dashboard_path = Path('components/dashboard/DashboardClient.tsx')
          dashboard = dashboard_path.read_text()
          dashboard = replace_once(
              dashboard,
              "import { cn } from '@/lib/utils'",
              "import { cn } from '@/lib/utils'\nimport TrackedLink from '@/components/analytics/TrackedLink'",
              'dashboard tracked link import',
          )
          dashboard = replace_once(
              dashboard,
              "                        <Link\n                            href={recommendation.href}\n                            className=\"mt-6 inline-flex min-h-11 items-center justify-center gap-2 border-2 border-gray-900 bg-blue-600 px-5 py-3 font-black text-white shadow-[4px_4px_0_0_#111] transition hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2\"\n                        >\n                            Kerjakan sekarang <ArrowRight size={18} />\n                        </Link>",
              "                        <TrackedLink\n                            href={recommendation.href}\n                            eventName=\"px_dashboard_action\"\n                            eventProperties={{ program: 'cpns', surface: 'dashboard', cta: data.activeSession ? 'resume_recommendation' : 'learning_recommendation' }}\n                            className=\"mt-6 inline-flex min-h-11 items-center justify-center gap-2 border-2 border-gray-900 bg-blue-600 px-5 py-3 font-black text-white shadow-[4px_4px_0_0_#111] transition hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2\"\n                        >\n                            Kerjakan sekarang <ArrowRight size={18} />\n                        </TrackedLink>",
              'dashboard recommendation action',
          )
          dashboard = replace_once(
              dashboard,
              "                    <Link href=\"/cpns/dashboard/beli-paket\" className=\"mt-5 inline-flex items-center gap-2 text-sm font-black text-blue-700 hover:underline\">\n                        Lihat pilihan token <ArrowRight size={15} />\n                    </Link>",
              "                    <TrackedLink\n                        href=\"/cpns/dashboard/beli-paket\"\n                        eventName=\"px_dashboard_action\"\n                        eventProperties={{ program: 'cpns', surface: 'dashboard', cta: 'token_packages' }}\n                        className=\"mt-5 inline-flex min-h-11 items-center gap-2 text-sm font-black text-blue-700 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2\"\n                    >\n                        Lihat pilihan token <ArrowRight size={15} />\n                    </TrackedLink>",
              'dashboard token action',
          )
          dashboard = replace_once(
              dashboard,
              "                    <Link href=\"/cpns/dashboard/riwayat\" className=\"inline-flex items-center gap-2 text-sm font-black text-blue-700 hover:underline\">\n                        Lihat semua hasil <ArrowRight size={16} />\n                    </Link>",
              "                    <TrackedLink\n                        href=\"/cpns/dashboard/riwayat\"\n                        eventName=\"px_dashboard_action\"\n                        eventProperties={{ program: 'cpns', surface: 'dashboard', cta: 'all_results' }}\n                        className=\"inline-flex min-h-11 items-center gap-2 text-sm font-black text-blue-700 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2\"\n                    >\n                        Lihat semua hasil <ArrowRight size={16} />\n                    </TrackedLink>",
              'dashboard history action',
          )
          dashboard = replace_once(
              dashboard,
              "                            <Link\n                                href={`/cpns/dashboard/tryout/${data.lastExam.id}/result`}\n                                className=\"mt-6 inline-flex items-center gap-2 text-sm font-black text-blue-200 hover:text-white hover:underline\"\n                            >\n                                Lihat hasil dan pembahasan <ArrowRight size={15} />\n                            </Link>",
              "                            <TrackedLink\n                                href={`/cpns/dashboard/tryout/${data.lastExam.id}/result`}\n                                eventName=\"px_dashboard_action\"\n                                eventProperties={{ program: 'cpns', surface: 'dashboard', cta: 'latest_result' }}\n                                className=\"mt-6 inline-flex min-h-11 items-center gap-2 text-sm font-black text-blue-200 hover:text-white hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-200 focus-visible:ring-offset-2 focus-visible:ring-offset-gray-900\"\n                            >\n                                Lihat hasil dan pembahasan <ArrowRight size={15} />\n                            </TrackedLink>",
              'dashboard latest result action',
          )
          dashboard_path.write_text(dashboard)

          result_path = Path('app/cpns/dashboard/tryout/[sessionId]/result/page.tsx')
          result = result_path.read_text()
          result = replace_once(
              result,
              "import { cn } from '@/lib/utils'",
              "import { cn } from '@/lib/utils'\nimport TrackedLink from '@/components/analytics/TrackedLink'",
              'result tracked link import',
          )
          result = replace_once(
              result,
              "                    <Link\n                        href={back.href}\n                        className=\"inline-flex items-center gap-2 rounded-xl border-2 border-gray-900 bg-white px-4 py-2 font-black text-gray-900 shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] transition hover:translate-x-px hover:translate-y-px hover:shadow-none\"\n                    >\n                        <ArrowLeft size={18} /> Kembali ke {back.label}\n                    </Link>",
              "                    <TrackedLink\n                        href={back.href}\n                        eventName=\"px_result_action\"\n                        eventProperties={{ program: 'cpns', surface: 'result', cta: `back_${back.label.replace(/\\s+/g, '_')}` }}\n                        className=\"inline-flex min-h-11 items-center gap-2 rounded-xl border-2 border-gray-900 bg-white px-4 py-2 font-black text-gray-900 shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] transition hover:translate-x-px hover:translate-y-px hover:shadow-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2\"\n                    >\n                        <ArrowLeft size={18} /> Kembali ke {back.label}\n                    </TrackedLink>",
              'result back action',
          )
          result_path.write_text(result)

      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/dashboard/DashboardClient.tsx 'app/cpns/dashboard/tryout/[sessionId]/result/page.tsx'
          git diff --cached --check
          git commit -m "feat(px): instrument dashboard and result actions"
          git push origin HEAD:feat/product-experience-v1-1
